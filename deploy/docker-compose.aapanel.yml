version: "3.9"

services:
  backend:
    build:
      context: ../crm-backend
      dockerfile: Dockerfile
    container_name: nhicrm-backend
    restart: unless-stopped
    env_file:
      - ./docker.aapanel.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - nhicrm_backend_storage:/app/storage

  frontend:
    build:
      context: ../crm-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: nhicrm-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3001"
    depends_on:
      - backend

  # Optional local PostgreSQL container (enable with --profile with-db)
  postgres:
    image: postgres:16-alpine
    container_name: nhicrm-postgres
    restart: unless-stopped
    profiles: ["with-db"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - nhicrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nhicrm_backend_storage:
  nhicrm_postgres_data:
