# =============================================================================
# NhiCRM — mẫu Apache 2.4: một domain, frontend + API (/api/) chung hostname
#
# Bật module (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http ssl headers
#   sudo systemctl restart apache2
#
# Vị trí trên SERVER:
#   /etc/apache2/sites-available/nhicrm.conf
# Kích hoạt:
#   sudo a2ensite nhicrm.conf
#   sudo apachectl configtest && sudo systemctl reload apache2
# =============================================================================

<VirtualHost *:80>
    # <<< THAY: domain thật
    ServerName crm.mobifonetayninh.vn

    # Khi đã có SSL thì bật redirect HTTPS
    Redirect permanent / https://crm.mobifonetayninh.vn/
</VirtualHost>

<VirtualHost *:443>
    # <<< THAY: cùng domain
    ServerName crm.mobifonetayninh.vn

    SSLEngine on
    # <<< THAY: đường dẫn cert
    SSLCertificateFile      /etc/letsencrypt/live/crm.mobifonetayninh.vn/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/crm.mobifonetayninh.vn/privkey.pem

    # ~25MB
    LimitRequestBody 26214400

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # QUAN TRỌNG: /api/ đứng trước /
    ProxyPass        /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
