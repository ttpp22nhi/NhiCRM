# =============================================================================
# NhiCRM — mẫu Nginx: một domain, frontend + API (/api/) chung hostname
#
# Vị trí trên SERVER (sau khi chỉnh): /etc/nginx/sites-available/nhicrm.conf
# Copy:   sudo cp deploy/nhicrm.conf /etc/nginx/sites-available/nhicrm.conf
# Bật:    sudo ln -sf /etc/nginx/sites-available/nhicrm.conf /etc/nginx/sites-enabled/
# Kiểm tra: sudo nginx -t && sudo systemctl reload nginx
#
# --- BẢNG THAM SỐ CẦN GHI ĐÚNG ---
# | Tham số / chỗ trong file          | Ghi chú |
# |------------------------------------|---------|
# | server_name (cả khối 80 và 443)    | Domain thật, khớp DNS A record |
# | ssl_certificate + ssl_certificate_key | Đường dẫn cert Let's Encrypt |
# | proxy_pass ...:3000                | Backend — khớp PORT trong crm-backend/.env |
# | proxy_pass ...:3001                | Next.js — khớp cổng `next start` |
# | client_max_body_size               | Upload (import Excel); tăng nếu 413 |
#
# Chưa có SSL: tạm bỏ khối server 443 + dòng return 301; chỉ listen 80 + location.
# Xem thêm: deploy/nhicrm-apache.conf nếu dùng Apache thay Nginx.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    # <<< THAY: domain thật
    server_name crm.congty.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.congty.com;

    ssl_certificate     /etc/letsencrypt/live/crm.congty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.congty.com/privkey.pem;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
