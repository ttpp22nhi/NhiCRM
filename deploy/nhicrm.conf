# =============================================================================
# NhiCRM — mẫu Nginx: một domain, frontend + API (/api/) chung hostname
#
# Vị trí trên SERVER (sau khi chỉnh): /etc/nginx/sites-available/nhicrm.conf
# Copy:   sudo cp deploy/nhicrm.conf /etc/nginx/sites-available/nhicrm.conf
# Bật:    sudo ln -sf /etc/nginx/sites-available/nhicrm.conf /etc/nginx/sites-enabled/
# Kiểm tra: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    # <<< THAY: domain thật
    server_name crm.mobifonetayninh.vn;

    # Chưa có SSL: có thể tạm comment dòng redirect để test HTTP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # <<< THAY: cùng domain như block 80
    server_name crm.mobifonetayninh.vn;

    # <<< THAY: đường dẫn cert thật
    ssl_certificate     /etc/letsencrypt/live/crm.mobifonetayninh.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.mobifonetayninh.vn/privkey.pem;

    # Upload body limit (tăng nếu cần)
    client_max_body_size 25M;

    # API -> backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web -> frontend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
